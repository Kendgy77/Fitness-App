<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#047857" />
    <title>Offline · Fitness Logger</title>
    <style>
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #f8fafc;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #0f172a; }
      main { max-width: 22rem; padding: 1.5rem; text-align: center; }
      img { width: 4rem; height: 4rem; }
      h1 { font-size: 1.25rem; margin: 1rem 0 0.5rem; }
      p { color: #475569; line-height: 1.5; margin: 0 0 1.25rem; }
      button { min-height: 2.75rem; padding: 0 1.25rem; border: 0; border-radius: 0.5rem; background: #047857;
        color: #fff; font: inherit; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Fitness Logger needs an internet connection to load your plans and workouts. Check the connection and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
