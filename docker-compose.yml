# Local development only. Start the database with: docker compose up -d db
# The password below is a throwaway local default, not a secret: the port is bound to 127.0.0.1 only.
services:
  db:
    image: postgres:16
    container_name: fitnessapp-db
    environment:
      POSTGRES_DB: fitnessapp
      POSTGRES_USER: fitnessapp
      POSTGRES_PASSWORD: fitnessapp_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - fitnessapp-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitnessapp -d fitnessapp"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  fitnessapp-db-data:
